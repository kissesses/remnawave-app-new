# Production overlay — используйте вместе с docker-compose.yml
#
#   docker compose -f docker-compose.yml -f docker-compose.production.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
#
# Env: cp .env.production.example .env

services:
  remnawave-app:
    environment:
      SHOPBOT_TRUST_PROXY: ${SHOPBOT_TRUST_PROXY:-1}
      SHOPBOT_SESSION_SECURE: ${SHOPBOT_SESSION_SECURE:-1}
      SHOPBOT_REQUIRE_TOTP: ${SHOPBOT_REQUIRE_TOTP:-1}
      SHOPBOT_DEBUG: ${SHOPBOT_DEBUG:-0}
      STEALTHX_AUTO_CONFIGURE: ${STEALTHX_AUTO_CONFIGURE:-1}
      STEALTHX_INIT_STRICT: ${STEALTHX_INIT_STRICT:-1}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:1337/login >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    stop_grace_period: 45s
    mem_limit: 1024m

  postgres:
    mem_limit: 768m

  redis:
    mem_limit: 192m
