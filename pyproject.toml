[project]
name = "remnawave-app"
version = "1.0.1"
description = "Remnawave App — Telegram-магазин VPN с веб-панелью"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiogram==3.27.0",
    "flask==3.1.1",
    "flask-wtf==1.2.1",
    "httpx==0.27.2",
    "pyotp==2.9.0",
    "webauthn==2.2.0",
    "qrcode[pil]==8.2",
    "yookassa==3.5.0",
    "aiosend==2.1.2",
    "aiohttp==3.9.5",
    "pytonconnect==0.3.2",
    "paramiko==3.5.0",
    "pyzipper==0.3.6",
    "psutil==5.9.8",
    "cryptography>=42.0.0",
    "redis>=5.0.0",
    "psycopg[binary]>=3.2.0",
    "uvicorn>=0.29.0",
    "fastapi>=0.110.0",
    "bleach>=6.1.0",
]

[project.optional-dependencies]
dev = [
    "pip-tools",
    "pylint",
    "black"
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
