[project]
name = "remnawave-app"
version = "1.0.3"
description = "Remnawave App — Telegram-магазин VPN с веб-панелью"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiogram==3.28.2",
    "flask==3.1.3",
    "flask-wtf==1.3.0",
    "httpx==0.28.1",
    "pyotp==2.9.0",
    "webauthn==2.7.1",
    "qrcode[pil]==8.2",
    "yookassa==3.10.1",
    "aiosend==3.0.6",
    "aiohttp==3.13.5",
    "pytonconnect==0.3.2",
    "paramiko==5.0.0",
    "pyzipper==0.4.0",
    "psutil==7.2.2",
    "cryptography==48.0.0",
    "redis==8.0.0",
    "psycopg[binary]==3.3.4",
    "uvicorn==0.49.0",
    "fastapi==0.136.3",
    "bleach==6.4.0",
]

[project.optional-dependencies]
dev = [
    "pip-tools",
    "pylint",
    "black"
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
