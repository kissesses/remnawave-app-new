# STEALTHX — production standalone (без Remnawave Panel)
#
# Образ из GHCR, hardened, без локальной сборки.
#
# Установка:
#   mkdir -p /opt/stealthx && cd /opt/stealthx
#   curl -O https://raw.githubusercontent.com/kissesses/remnawave-app-new/main/docker-compose.stealthx.prod.yml
#   curl -O https://raw.githubusercontent.com/kissesses/remnawave-app-new/main/.env.stealthx.production.example
#   cp .env.stealthx.production.example .env
#   # заполните секреты
#   ./scripts/docker-stealthx-prod-up.sh
#
# Nginx на хосте → 127.0.0.1:8000 (landing + /app)
# Пример: src/shop_bot/webapp/stealthx/deploy/nginx/stealthx.conf

x-common: &common
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 50m
      max-file: 5

x-hardening: &hardening
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-hardening-db: &hardening-db
  init: true
  security_opt:
    - no-new-privileges:true

services:
  remnawave-app:
    image: ghcr.io/kissesses/remnawave-app-new:${SHOPBOT_IMAGE_TAG:-latest}
    container_name: stealthx-app
    <<: [*common, *logging, *hardening]
    stop_grace_period: 45s
    mem_limit: 1024m
    cpus: "1.5"
    ports:
      - "127.0.0.1:1337:1337"
      - "127.0.0.1:8000:8000"
    env_file: .env
    volumes:
      - stealthx-shopbot-data:/app/project/data
      - stealthx-backups-data:/app/project/backups
    environment:
      TZ: ${TZ:-Europe/Moscow}
      SHOPBOT_DATABASE_URL: postgresql://${POSTGRES_USER:-shopbot}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shopbot}
      SHOPBOT_REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      STEALTHX_DATABASE_URL: postgresql://${POSTGRES_USER:-shopbot}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shopbot}
      SHOPBOT_SECRET_KEY: ${SHOPBOT_SECRET_KEY:?Set SHOPBOT_SECRET_KEY}
      SHOPBOT_MASTER_KEY: ${SHOPBOT_MASTER_KEY:-}
      SHOPBOT_SESSION_SECURE: ${SHOPBOT_SESSION_SECURE:-1}
      SHOPBOT_REQUIRE_TOTP: ${SHOPBOT_REQUIRE_TOTP:-1}
      SHOPBOT_TRUST_PROXY: ${SHOPBOT_TRUST_PROXY:-1}
      SHOPBOT_WEBAPP_TOKEN_DAYS: ${SHOPBOT_WEBAPP_TOKEN_DAYS:-90}
      SHOPBOT_DEBUG: ${SHOPBOT_DEBUG:-0}
      SHOPBOT_RP_ID: ${SHOPBOT_RP_ID:-}
      SHOPBOT_RP_ORIGIN: ${SHOPBOT_RP_ORIGIN:-}
      STEALTHX_JWT_SECRET: ${STEALTHX_JWT_SECRET:-}
      STEALTHX_JWT_ACCESS_MINUTES: ${STEALTHX_JWT_ACCESS_MINUTES:-15}
      STEALTHX_JWT_REFRESH_DAYS: ${STEALTHX_JWT_REFRESH_DAYS:-7}
      STEALTHX_AUTO_CONFIGURE: ${STEALTHX_AUTO_CONFIGURE:-1}
      STEALTHX_INIT_STRICT: ${STEALTHX_INIT_STRICT:-1}
      SHOPBOT_DATA_DIR: /app/project/data
      SHOPBOT_BACKUPS_DIR: /app/project/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:1337/login >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stealthx-prod-net

  postgres:
    image: postgres:18-alpine
    container_name: stealthx-postgres
    <<: [*common, *logging, *hardening-db]
    mem_limit: 768m
    cpus: "1.0"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-shopbot}
    volumes:
      - stealthx-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopbot} -d ${POSTGRES_DB:-shopbot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - stealthx-prod-net

  redis:
    image: redis:8-alpine
    container_name: stealthx-redis
    <<: [*common, *logging, *hardening-db]
    mem_limit: 192m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --loglevel
      - warning
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - stealthx-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - stealthx-prod-net

networks:
  stealthx-prod-net:
    driver: bridge

volumes:
  stealthx-shopbot-data:
  stealthx-postgres-data:
  stealthx-redis-data:
  stealthx-backups-data:
