name: Telegram Push Notify

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate Telegram secrets
        run: |
          missing=0
          if [ -z "${{ secrets.TELEGRAM_RELEASE_BOT_TOKEN }}" ]; then
            echo "::error::Missing secret TELEGRAM_RELEASE_BOT_TOKEN"
            missing=1
          fi
          if [ -z "${{ secrets.TELEGRAM_RELEASE_CHAT_ID }}" ]; then
            echo "::error::Missing secret TELEGRAM_RELEASE_CHAT_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Create secrets here: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "Required names (exact): TELEGRAM_RELEASE_BOT_TOKEN, TELEGRAM_RELEASE_CHAT_ID"
            echo "Optional: TELEGRAM_RELEASE_TOPIC_ID"
            exit 1
          fi

      - name: Notify Telegram
        env:
          TELEGRAM_RELEASE_BOT_TOKEN: ${{ secrets.TELEGRAM_RELEASE_BOT_TOKEN }}
          TELEGRAM_RELEASE_CHAT_ID: ${{ secrets.TELEGRAM_RELEASE_CHAT_ID }}
          TELEGRAM_RELEASE_TOPIC_ID: ${{ secrets.TELEGRAM_RELEASE_TOPIC_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_COMMITS_JSON: ${{ toJSON(github.event.commits) }}
          GITHUB_HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: python3 .github/scripts/telegram-push-notify.py
