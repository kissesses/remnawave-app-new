name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate release notes
        id: notes
        run: |
          chmod +x .github/scripts/release-notes.sh
          BODY=$(.github/scripts/release-notes.sh "${{ github.ref_name }}")
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ format('🚀 remnawave-app {0}', github.ref_name) }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false
          draft: false
          prerelease: false

      - name: Notify Telegram
        if: success()
        env:
          TELEGRAM_RELEASE_BOT_TOKEN: ${{ secrets.TELEGRAM_RELEASE_BOT_TOKEN }}
          TELEGRAM_RELEASE_CHAT_ID: ${{ secrets.TELEGRAM_RELEASE_CHAT_ID }}
          TELEGRAM_RELEASE_TOPIC_ID: ${{ secrets.TELEGRAM_RELEASE_TOPIC_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<EOF
          ${{ steps.notes.outputs.body }}
          EOF
          python3 .github/scripts/telegram-release-notify.py \
            "${{ github.ref_name }}" \
            "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" \
            "$BODY_FILE"
          rm -f "$BODY_FILE"
