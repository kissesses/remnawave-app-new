name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate release notes
        id: notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x .github/scripts/release-notes.sh
          BODY=$(.github/scripts/release-notes.sh "${{ github.ref_name }}")
          TITLE=$(printf '%s\n' "$BODY" | head -1 | sed 's/^# //')
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.title }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false
          draft: false
          prerelease: false

      - name: Validate Telegram secrets
        run: |
          missing=0
          if [ -z "${{ secrets.TELEGRAM_RELEASE_BOT_TOKEN }}" ]; then
            echo "::error::Missing secret TELEGRAM_RELEASE_BOT_TOKEN"
            missing=1
          fi
          if [ -z "${{ secrets.TELEGRAM_RELEASE_CHAT_ID }}" ]; then
            echo "::error::Missing secret TELEGRAM_RELEASE_CHAT_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Create secrets: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

      - name: Notify Telegram
        if: success()
        env:
          TELEGRAM_RELEASE_BOT_TOKEN: ${{ secrets.TELEGRAM_RELEASE_BOT_TOKEN }}
          TELEGRAM_RELEASE_CHAT_ID: ${{ secrets.TELEGRAM_RELEASE_CHAT_ID }}
          TELEGRAM_RELEASE_TOPIC_ID: ${{ secrets.TELEGRAM_RELEASE_TOPIC_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<EOF
          ${{ steps.notes.outputs.body }}
          EOF
          python3 .github/scripts/telegram-release-notify.py \
            "${{ github.ref_name }}" \
            "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" \
            "$BODY_FILE"
          rm -f "$BODY_FILE"
