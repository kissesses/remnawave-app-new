# STEALTHX — standalone Docker (без Remnawave Panel / remnawave-network)
#
# Быстрый старт:
#   cp .env.stealthx.example .env.stealthx
#   # задайте POSTGRES_PASSWORD, REDIS_PASSWORD, SHOPBOT_SECRET_KEY
#   ./scripts/docker-stealthx-up.sh
#
# Или вручную:
#   docker compose -f docker-compose.stealthx.yml --env-file .env.stealthx up -d --build

x-common: &common
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 50m
      max-file: 3

services:
  remnawave-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DOCKER_CLI: 0
    image: remnawave-stealthx:local
    container_name: remnawave-stealthx
    <<: [*common, *logging]
    stop_grace_period: 30s
    mem_limit: 768m
    cpus: "1.0"
    ports:
      - "127.0.0.1:1337:1337"
      - "127.0.0.1:8000:8000"
    env_file: .env.stealthx
    volumes:
      - stealthx-shopbot-data:/app/project/data
      - stealthx-backups-data:/app/project/backups
    environment:
      TZ: ${TZ:-Europe/Moscow}
      SHOPBOT_DATABASE_URL: postgresql://${POSTGRES_USER:-shopbot}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shopbot}
      SHOPBOT_REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      STEALTHX_DATABASE_URL: postgresql://${POSTGRES_USER:-shopbot}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shopbot}
      SHOPBOT_SECRET_KEY: ${SHOPBOT_SECRET_KEY:?Set SHOPBOT_SECRET_KEY}
      SHOPBOT_SESSION_SECURE: ${SHOPBOT_SESSION_SECURE:-0}
      SHOPBOT_REQUIRE_TOTP: ${SHOPBOT_REQUIRE_TOTP:-0}
      SHOPBOT_WEBAPP_TOKEN_DAYS: ${SHOPBOT_WEBAPP_TOKEN_DAYS:-90}
      SHOPBOT_DEBUG: ${SHOPBOT_DEBUG:-0}
      STEALTHX_JWT_SECRET: ${STEALTHX_JWT_SECRET:-}
      STEALTHX_JWT_ACCESS_MINUTES: ${STEALTHX_JWT_ACCESS_MINUTES:-15}
      STEALTHX_JWT_REFRESH_DAYS: ${STEALTHX_JWT_REFRESH_DAYS:-7}
      STEALTHX_AUTO_CONFIGURE: ${STEALTHX_AUTO_CONFIGURE:-1}
      STEALTHX_INIT_STRICT: ${STEALTHX_INIT_STRICT:-0}
      SHOPBOT_DATA_DIR: /app/project/data
      SHOPBOT_BACKUPS_DIR: /app/project/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:1337/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stealthx-net

  postgres:
    image: postgres:18-alpine
    container_name: stealthx-postgres
    <<: [*common, *logging]
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-shopbot}
    volumes:
      - stealthx-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopbot} -d ${POSTGRES_DB:-shopbot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - stealthx-net

  redis:
    image: redis:8-alpine
    container_name: stealthx-redis
    <<: [*common, *logging]
    mem_limit: 128m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --loglevel
      - warning
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - stealthx-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - stealthx-net

networks:
  stealthx-net:
    driver: bridge

volumes:
  stealthx-shopbot-data:
  stealthx-postgres-data:
  stealthx-redis-data:
  stealthx-backups-data:
