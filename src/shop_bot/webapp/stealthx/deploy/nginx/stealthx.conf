# STEALTHX reverse proxy (Remnawave Panel co-install)
# Include inside your Remnawave nginx server block.

upstream stealthx_webapp {
    server remnawave-app-new:8000;
    keepalive 16;
}

# Public landing
location / {
    proxy_pass http://stealthx_webapp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Telegram cabinet
location /app {
    proxy_pass http://stealthx_webapp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# API
location /api {
    proxy_pass http://stealthx_webapp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Vite assets — long cache
location /assets {
    proxy_pass http://stealthx_webapp;
    proxy_http_version 1.1;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Static files
location /static {
    proxy_pass http://stealthx_webapp;
    proxy_http_version 1.1;
    add_header Cache-Control "public, max-age=86400";
}

# Security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
