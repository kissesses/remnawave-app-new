# STEALTHX — Nginx production (HTTPS)
# Подключите в server {} вашего домена (app.example.com / stealthx.example.com).
# Upstream — контейнер на 127.0.0.1:8000 (docker-compose.stealthx.prod.yml)
# или remnawave-app-new:8000 в сети remnawave-network (co-install).

upstream stealthx_webapp {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Co-install в remnawave-nginx:
# upstream stealthx_webapp {
#     server remnawave-app-new:8000;
#     keepalive 16;
# }

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stealthx.example.com;

    # ssl_certificate /etc/letsencrypt/live/stealthx.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/stealthx.example.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 16m;

    # Landing + cabinet SPA + API
    location / {
        proxy_pass http://stealthx_webapp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /assets/ {
        proxy_pass http://stealthx_webapp;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /static/ {
        proxy_pass http://stealthx_webapp;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=86400";
    }

    location /api/ {
        proxy_pass http://stealthx_webapp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name stealthx.example.com;
    return 301 https://$host$request_uri;
}
