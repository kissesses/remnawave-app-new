<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Remnawave ShopBot">
  <defs>
    <linearGradient id="bg" x1="96" y1="64" x2="416" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12121A"/>
      <stop offset="1" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="ring" x1="128" y1="128" x2="384" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="0.35" stop-color="#94A3B8"/>
      <stop offset="0.7" stop-color="#64748B"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="r-face" x1="168" y1="128" x2="360" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="0.45" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="r-bevel" x1="168" y1="120" x2="168" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.18" stop-color="#CBD5E1"/>
      <stop offset="0.55" stop-color="#475569"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="r-shadow" x1="280" y1="256" x2="360" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="flare" x1="96" y1="256" x2="416" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E0F2FE" stop-opacity="0.85"/>
      <stop offset="0.58" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cross" x1="196" y1="248" x2="332" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset="0.5" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <ellipse cx="256" cy="268" rx="170" ry="120" fill="#6366F1" opacity="0.08"/>

  <!-- Ring (Avengers-style open circle) -->
  <path d="M256 92
    A164 164 0 1 1 132 332"
    stroke="url(#ring)" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M380 332
    A164 164 0 0 1 256 92"
    stroke="url(#ring)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.35"/>

  <!-- Lens flare -->
  <rect x="88" y="238" width="336" height="36" fill="url(#flare)" opacity="0.9" filter="url(#soft)"/>

  <!-- R: stem shadow -->
  <path fill="url(#r-shadow)" d="M176 132 H214 V380 H176 Z"/>

  <!-- R: main body -->
  <path fill="url(#r-face)" d="
    M188 132 H226 V248 H286
    C318 248 334 228 334 196
    C334 160 308 132 268 132
    H188 Z
    M226 176 H262
    C282 176 294 186 294 204
    C294 222 282 232 262 232
    H226 V176 Z
    M226 248 L318 380 H272 L226 302 V380 H188 V132 H226 V248 Z"/>

  <!-- R: left bevel highlight -->
  <path fill="url(#r-bevel)" opacity="0.55" d="M188 132 H202 V380 H188 Z"/>

  <!-- Crossbar arrow (Marvel A nod) -->
  <path fill="url(#cross)" d="M204 244 H300 L318 256 L300 268 H204 Z"/>

  <!-- Top edge shine -->
  <path fill="#FFFFFF" opacity="0.12" d="M188 132 H268 C306 132 328 158 328 196 C328 210 324 222 316 232 H226 V132 H188 Z"/>
</svg>
