<script>
    (function () {
        const routes = window.__MONITOR_ROUTES__ || {};
        let mainChart = null;
        let localMiniChart = null;
        let autoRefreshInterval = null;
        let currentPeriod = 6;
        let lastNetworkData = null;
        let lastNetworkTime = null;
        const NETWORK_DATA_KEY = 'monitor_network_data';
        const NETWORK_TIME_KEY = 'monitor_network_time';

        async function fetchJSON(url) {
            try {
                const resp = await fetch(url, { credentials: 'same-origin' });
                return await resp.json();
            } catch (e) { return { ok: false, error: String(e) }; }
        }

        function fmtBytes(n) {
            if (n == null) return '—';
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            let i = 0, x = Number(n);
            while (x >= 1024 && i < units.length - 1) { x /= 1024; i++; }
            return x.toFixed(1) + ' ' + units[i];
        }

        function fmtPct(x) { return (x == null) ? '—' : (Number(x).toFixed(1) + '%'); }

        function secsToDHMS(s) {
            if (!s && s !== 0) return '—';
            s = Number(s);
            const d = Math.floor(s / 86400); s %= 86400;
            const h = Math.floor(s / 3600); s %= 3600;
            const m = Math.floor(s / 60);
            const sec = s % 60;
            const parts = [];
            if (d) parts.push(d + 'д');
            if (h) parts.push(h + 'ч');
            if (m) parts.push(m + 'м');
            if (sec && parts.length === 0) parts.push(sec + 'с');
            return parts.join(' ') || '< 1м';
        }

        function getStatusColor(value, thresholds = { warning: 70, critical: 90 }) {
            if (value == null) return 'mn-status--muted';
            if (value >= thresholds.critical) return 'mn-status--critical';
            if (value >= thresholds.warning) return 'mn-status--warn';
            return 'mn-status--ok';
        }

        function progressFillClass(percent) {
            if (percent >= 90) return 'mn-progress__fill--critical';
            if (percent >= 70) return 'mn-progress__fill--warn';
            return 'mn-progress__fill--ok';
        }

        function metricRow(label, percent, fillClass, extraHtml) {
            return `
                <div class="mn-metric-item">
                    <div class="mn-metric-item__label">
                        <span>${label}</span>
                        <span class="${getStatusColor(percent)}">${fmtPct(percent)}</span>
                    </div>
                    <div class="mn-progress">
                        <div class="mn-progress__fill ${fillClass}" style="width:${percent || 0}%"></div>
                    </div>
                    ${extraHtml || ''}
                </div>`;
        }

        function calculateNetworkSpeed(currentData, sourceId = 'default') {
            const now = Date.now();
            const dataKey = `${NETWORK_DATA_KEY}_${sourceId}`;
            const timeKey = `${NETWORK_TIME_KEY}_${sourceId}`;
            try {
                const savedData = localStorage.getItem(dataKey);
                const savedTime = localStorage.getItem(timeKey);
                if (savedData && savedTime) {
                    lastNetworkData = JSON.parse(savedData);
                    lastNetworkTime = parseInt(savedTime);
                }
            } catch (e) { }
            if (!lastNetworkData || !lastNetworkTime) {
                lastNetworkData = currentData;
                lastNetworkTime = now;
                try {
                    localStorage.setItem(dataKey, JSON.stringify(currentData));
                    localStorage.setItem(timeKey, now.toString());
                } catch (e) { }
                return { upSpeed: 0, downSpeed: 0, totalSpeed: 0 };
            }
            const timeDiff = (now - lastNetworkTime) / 1000;
            if (timeDiff < 1) return { upSpeed: 0, downSpeed: 0, totalSpeed: 0 };
            const bytesUpDiff = (currentData.bytes_sent || 0) - (lastNetworkData.bytes_sent || 0);
            const bytesDownDiff = (currentData.bytes_recv || 0) - (lastNetworkData.bytes_recv || 0);
            const upSpeed = Math.max(0, bytesUpDiff / timeDiff);
            const downSpeed = Math.max(0, bytesDownDiff / timeDiff);
            lastNetworkData = currentData;
            lastNetworkTime = now;
            try {
                localStorage.setItem(dataKey, JSON.stringify(currentData));
                localStorage.setItem(timeKey, now.toString());
            } catch (e) { }
            return { upSpeed, downSpeed, totalSpeed: upSpeed + downSpeed };
        }

        function updateStatsCards(data) {
            if (!data || !data.ok) return;
            const isRemote = data.uname !== undefined;
            let cpu, mem, disk, net;
            if (isRemote) {
                cpu = { percent: data.cpu_percent || 0, count_logical: data.cpu_count || '—' };
                mem = { percent: data.memory_percent || 0, used: (data.memory_used_mb || 0) * 1024 * 1024, total: (data.memory_total_mb || 0) * 1024 * 1024 };
                disk = { percent: data.disk_percent || 0, mountpoint: data.disk_mountpoint || '/' };
                net = { bytes_sent: data.network_sent || 0, bytes_recv: data.network_recv || 0 };
            } else {
                cpu = data.cpu || {};
                mem = data.memory || {};
                const diskPercent = data.disk_percent !== undefined ? data.disk_percent : (data.disks?.[0]?.percent || 0);
                disk = { percent: diskPercent, mountpoint: data.disks?.[0]?.mountpoint || '/' };
                net = data.net || {};
            }
            const networkSpeed = calculateNetworkSpeed(net, 'stats_cards');
            document.getElementById('cpu-stat').innerHTML = `<span class="${getStatusColor(cpu.percent)}">${fmtPct(cpu.percent)}</span>`;
            document.getElementById('cpu-trend').textContent = `${cpu.count_logical || '—'} ядер`;
            document.getElementById('memory-stat').innerHTML = `<span class="${getStatusColor(mem.percent)}">${fmtPct(mem.percent)}</span>`;
            document.getElementById('memory-trend').textContent = `${fmtBytes(mem.used || 0)} / ${fmtBytes(mem.total || 0)}`;
            document.getElementById('disk-stat').innerHTML = `<span class="${getStatusColor(disk.percent)}">${fmtPct(disk.percent)}</span>`;
            document.getElementById('disk-trend').textContent = disk.mountpoint || '/';
            const speedTotal = fmtBytes(networkSpeed.totalSpeed) + '/с';
            const speedUp = fmtBytes(networkSpeed.upSpeed) + '/с';
            const speedDown = fmtBytes(networkSpeed.downSpeed) + '/с';
            document.getElementById('network-stat').innerHTML = `<span class="mn-status--net">${speedTotal}</span>`;
            document.getElementById('network-trend').innerHTML = `↓${speedDown}  ↑${speedUp}`;
        }

        function renderLocal(el, data) {
            if (!data || !data.ok) {
                el.innerHTML = `<div class="mn-metrics-error"><span class="material-symbols-outlined">error</span><span>${data?.error || 'Сбой получения данных'}</span></div>`;
                return;
            }
            const cpu = data.cpu || {};
            const mem = data.memory || {};
            const sw = data.swap || {};
            const disks = (data.disks || []);

            const diskHtml = disks.map((d) => metricRow(
                d.mountpoint || d.device || 'Disk',
                d.percent,
                progressFillClass(d.percent || 0)
            )).join('');

            el.innerHTML = `
                <div class="mn-metric-meta">
                    <div class="mn-metric-meta__tile">
                        <div class="mn-metric-meta__label">Хостнейм</div>
                        <div class="mn-metric-meta__value" title="${data.hostname || ''}">${data.hostname || '—'}</div>
                    </div>
                    <div class="mn-metric-meta__tile">
                        <div class="mn-metric-meta__label">Uptime</div>
                        <div class="mn-metric-meta__value mn-status--ok">${secsToDHMS(data.uptime_sec)}</div>
                    </div>
                </div>
                <div class="mn-metric-stack">
                    ${metricRow(`CPU (${cpu.count_logical || '—'} cores)`, cpu.percent, 'mn-progress__fill--cpu')}
                    ${metricRow('RAM', mem.percent, 'mn-progress__fill--ram', `<div class="mn-metric-item__extra">${fmtBytes(mem.used)} / ${fmtBytes(mem.total)}</div>`)}
                    ${sw.total ? metricRow('SWAP', sw.percent, 'mn-progress__fill--swap') : ''}
                    ${diskHtml}
                </div>
            `;
        }

        function renderRemote(el, data) {
            if (!data || !data.ok) {
                el.innerHTML = `<div class="mn-metrics-error"><span class="material-symbols-outlined">error</span><span>${data?.error || 'Сбой данных'}</span></div>`;
                return;
            }
            const cpu = { percent: data.cpu_percent || 0, count: data.cpu_count || '—' };
            const mem = { percent: data.memory_percent || 0, used_mb: data.memory_used_mb || 0, total_mb: data.memory_total_mb || 0 };
            const disk = { percent: data.disk_percent || 0, mountpoint: data.disk_mountpoint || '/' };

            el.innerHTML = `
                <div class="mn-metric-meta mn-metric-meta--compact">
                    <div class="mn-metric-meta__tile">
                        <div class="mn-metric-meta__label">Система</div>
                        <div class="mn-metric-meta__value" title="${data.uname || ''}">${data.uname || '—'}</div>
                    </div>
                    <div class="mn-metric-meta__tile">
                        <div class="mn-metric-meta__label">Uptime</div>
                        <div class="mn-metric-meta__value mn-status--net">${secsToDHMS(data.uptime_sec)}</div>
                    </div>
                </div>
                <div class="mn-metric-stack">
                    ${metricRow(`CPU (${cpu.count} ядер)`, cpu.percent, 'mn-progress__fill--cpu')}
                    ${metricRow('RAM', mem.percent, 'mn-progress__fill--ram', `<div class="mn-metric-item__extra">${mem.used_mb} MB / ${mem.total_mb} MB</div>`)}
                    ${metricRow(`DISK (${disk.mountpoint})`, disk.percent, progressFillClass(disk.percent))}
                </div>
            `;
        }

        function createMainChart() {
            const ctx = document.getElementById('main-chart');
            if (!ctx) return null;
            mainChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: 'CPU',
                            data: [],
                            borderColor: '#22d3ee',
                            backgroundColor: 'transparent',
                            borderWidth: 2,
                            fill: false,
                            tension: 0.15,
                            pointRadius: 0,
                            pointHoverRadius: 4,
                            pointBackgroundColor: '#22d3ee'
                        },
                        {
                            label: 'RAM',
                            data: [],
                            borderColor: '#22c55e',
                            backgroundColor: 'transparent',
                            borderWidth: 2,
                            fill: false,
                            tension: 0.15,
                            pointRadius: 0,
                            pointHoverRadius: 4,
                            pointBackgroundColor: '#22c55e'
                        },
                        {
                            label: 'Disk',
                            data: [],
                            borderColor: '#facc15',
                            backgroundColor: 'transparent',
                            borderWidth: 2,
                            fill: false,
                            tension: 0.15,
                            pointRadius: 0,
                            pointHoverRadius: 4,
                            pointBackgroundColor: '#facc15'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { intersect: false, mode: 'index' },
                    plugins: {
                        decimation: { enabled: true, algorithm: 'lttb', samples: 120 },
                        legend: {
                            position: 'top',
                            align: 'end',
                            labels: {
                                color: '#9ca3af',
                                usePointStyle: true,
                                boxWidth: 6,
                                padding: 20,
                                font: { family: "'Inter', sans-serif", size: 10, weight: 600 }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            titleColor: '#f3f4f6',
                            bodyColor: '#d1d5db',
                            borderColor: 'rgba(255,255,255,0.1)',
                            borderWidth: 1,
                            cornerRadius: 8,
                            padding: 10,
                            displayColors: true,
                            boxPadding: 4,
                            titleFont: { size: 11, weight: 600, family: "'Inter', sans-serif" },
                            bodyFont: { size: 10, family: "'Inter', sans-serif" }
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                color: '#6b7280',
                                font: { size: 9, family: "'Inter', sans-serif" },
                                maxRotation: 0,
                                autoSkip: true,
                                maxTicksLimit: 8
                            },
                            grid: {
                                color: 'rgba(255,255,255,0.02)',
                                drawBorder: false
                            }
                        },
                        y: {
                            min: 0,
                            max: 100,
                            ticks: {
                                color: '#6b7280',
                                font: { size: 9, family: "'Inter', sans-serif" },
                                callback: v => v + '%',
                                stepSize: 20
                            },
                            grid: {
                                color: 'rgba(255,255,255,0.02)',
                                drawBorder: false
                            }
                        }
                    },
                    animation: false
                }
            });
            return mainChart;
        }

        function createLocalMiniChart() {
            const ctx = document.getElementById('local-mini-chart');
            if (!ctx) return null;
            localMiniChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['CPU', 'RAM', 'Disk'],
                    datasets: [{ data: [0, 0, 0], backgroundColor: ['#22d3ee', '#22c55e', '#facc15'], borderWidth: 0, hoverOffset: 4 }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '75%',
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(0,0,0,0.8)',
                            borderColor: 'rgba(255,255,255,0.1)',
                            borderWidth: 1,
                            bodyFont: { size: 10, family: "'Inter', sans-serif" },
                            boxPadding: 4,
                            callbacks: {
                                label: function (context) {
                                    return ' ' + context.label + ': ' + context.raw + '%';
                                }
                            }
                        }
                    }
                }
            });
            return localMiniChart;
        }

        async function refreshCharts() {
            const selector = document.getElementById('server-selector');
            const selectedValue = selector ? selector.value : 'local';

            let url;
            if (selectedValue === 'local') {
                url = `${routes.seriesLocal}?hours=${currentPeriod}`;
            } else if (selectedValue.startsWith('remote:')) {
                const hostName = selectedValue.replace('remote:', '');
                url = `${routes.seriesHost.replace('__H__', encodeURIComponent(hostName))}?hours=${currentPeriod}`;
            } else {
                url = `${routes.seriesLocal}?hours=${currentPeriod}`;
            }

            const res = await fetchJSON(url);
            if (!res || !res.ok || !mainChart) return;
            const items = res.items || [];
            if (items.length === 0) {
                mainChart.data.labels = ['Нет данных'];
                mainChart.data.datasets[0].data = [0];
                mainChart.data.datasets[1].data = [0];
                mainChart.data.datasets[2].data = [0];
                mainChart.update('none');
                return;
            }
            const labels = items.map(i => {
                const date = new Date(i.created_at);
                return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            });
            mainChart.data.labels = labels;
            mainChart.data.datasets[0].data = items.map(i => i.cpu_percent ?? null);
            mainChart.data.datasets[1].data = items.map(i => i.mem_percent ?? null);
            mainChart.data.datasets[2].data = items.map(i => i.disk_percent ?? null);
            mainChart.update('none');

            if (localMiniChart && items.length > 0) {
                const last = items[items.length - 1];
                localMiniChart.data.datasets[0].data = [last.cpu_percent || 0, last.mem_percent || 0, last.disk_percent || 0];
                localMiniChart.update('none');
            }
        }

        async function refreshLocalPanel() {
            const el = document.getElementById('local-metrics');
            const selector = document.getElementById('server-selector');
            const selectedValue = selector ? selector.value : 'local';

            if (selectedValue === 'local') {
                const data = await fetchJSON(routes.local);
                renderLocal(el, data);
                updateStatsCards(data);
            } else if (selectedValue.startsWith('remote:')) {
                const hostName = selectedValue.replace('remote:', '');
                const data = await fetchJSON(routes.host.replace('__H__', encodeURIComponent(hostName)));
                renderRemote(el, data);
                updateStatsCards(data);
            }
        }

        async function refreshHost(hostName, metricsEl, statusEl) {
            if (metricsEl) {
                metricsEl.innerHTML = `<div class="mn-metrics-loading mn-metrics-loading--sm"><span class="material-symbols-outlined mn-spin">progress_activity</span><span>Загрузка...</span></div>`;
            }
            if (statusEl) statusEl.className = 'mn-host-card__status mn-host-card__status--warn';
            const data = await fetchJSON(routes.host.replace('__H__', encodeURIComponent(hostName)));
            if (metricsEl) renderRemote(metricsEl, data);
            if (statusEl) {
                statusEl.className = `mn-host-card__status ${data.ok ? 'mn-host-card__status--ok' : 'mn-host-card__status--err'}`;
            }
        }

        async function refreshTarget(targetName, metricsEl, statusEl) {
            if (metricsEl) {
                metricsEl.innerHTML = `<div class="mn-metrics-loading mn-metrics-loading--sm"><span class="material-symbols-outlined mn-spin">progress_activity</span><span>Загрузка...</span></div>`;
            }
            if (statusEl) statusEl.className = 'mn-host-card__status mn-host-card__status--warn';
            const data = await fetchJSON(routes.target.replace('__T__', encodeURIComponent(targetName)));
            if (metricsEl) renderRemote(metricsEl, data);
            if (statusEl) {
                statusEl.className = `mn-host-card__status ${data.ok ? 'mn-host-card__status--ok' : 'mn-host-card__status--err'}`;
            }
        }

        function refreshAllHosts() {
            document.querySelectorAll('.host-refresh-btn').forEach(btn => {
                const hostName = btn.getAttribute('data-host');
                const targetSel = btn.getAttribute('data-target');
                const metricsEl = document.querySelector(targetSel);
                const idx = Array.from(document.querySelectorAll('.host-refresh-btn')).indexOf(btn) + 1;
                const statusEl = document.getElementById(`host-status-${idx}`);
                refreshHost(hostName, metricsEl, statusEl);
            });
        }

        function refreshAllTargets() {
            document.querySelectorAll('.target-refresh-btn').forEach(btn => {
                const targetName = btn.getAttribute('data-target-name');
                const targetSel = btn.getAttribute('data-target');
                const metricsEl = document.querySelector(targetSel);
                const idx = Array.from(document.querySelectorAll('.target-refresh-btn')).indexOf(btn) + 1;
                const statusEl = document.getElementById(`target-status-${idx}`);
                refreshTarget(targetName, metricsEl, statusEl);
            });
        }

        function touchLastRefresh() {
            const el = document.getElementById('mn-last-refresh');
            if (!el) return;
            const now = new Date();
            el.textContent = `· обновлено ${now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
        }

        async function refreshAll() {
            await refreshLocalPanel();
            await refreshCharts();
            refreshAllHosts();
            refreshAllTargets();
            touchLastRefresh();
        }

        function initMonitorTabs() {
            const tabs = document.querySelectorAll('#mn-tabs .mn-tab');
            const panels = document.querySelectorAll('[data-mn-panel]');
            tabs.forEach((btn) => {
                btn.addEventListener('click', () => {
                    const name = btn.dataset.mnTab;
                    tabs.forEach((t) => t.classList.toggle('is-active', t.dataset.mnTab === name));
                    panels.forEach((p) => p.classList.toggle('hidden', p.dataset.mnPanel !== name));
                    if (name === 'hosts') refreshAllHosts();
                    if (name === 'ssh') refreshAllTargets();
                });
            });
        }

        function initMonitor() {
            if (window.__monitorReady) return;
            window.__monitorReady = true;
            createMainChart();
            createLocalMiniChart();
            initMonitorTabs();
            refreshAll();

            document.getElementById('refresh-all')?.addEventListener('click', refreshAll);

            if (document.getElementById('server-selector')) {
                if (typeof initSoftSelect === 'function') {
                    initSoftSelect('server-selector', 'Локальная');
                } else {
                    const sel = document.getElementById('server-selector');
                    const menus = document.querySelectorAll('.soft-select-item');
                    const toggle = document.querySelector('.soft-select-toggle span:first-child');

                    menus.forEach(menuItem => {
                        menuItem.addEventListener('click', function (e) {
                            e.preventDefault();
                            menus.forEach(m => m.classList.remove('is-active', 'bg-white/5'));
                            this.classList.add('is-active', 'bg-white/5');

                            const val = this.getAttribute('data-value');
                            if (toggle) toggle.textContent = this.textContent.trim();

                            if (sel) {
                                sel.value = val;
                                sel.dispatchEvent(new Event('change'));
                            }

                            document.querySelector('.soft-select-menu').classList.add('hidden');
                        });
                    });

                    const tgBtn = document.querySelector('.soft-select-toggle');
                    if (tgBtn) {
                        tgBtn.addEventListener('click', () => {
                            document.querySelector('.soft-select-menu').classList.toggle('hidden');
                        });
                    }
                }
            }

            const serverSelector = document.getElementById('server-selector');
            if (serverSelector) {
                serverSelector.addEventListener('change', async () => {
                    await refreshLocalPanel();
                    await refreshCharts();
                });
            }

            document.getElementById('clear-metrics')?.addEventListener('click', () => {
                if (window.showConfirmModal) {
                    showConfirmModal('Вы уверены, что хотите удалить все старые замеры из БД?\n\nЭто действие необратимо и освободит память, но не повлияет на текущую статистику.', async () => {
                        await performClearMetrics();
                    });
                } else if (confirm('Вы уверены, что хотите удалить все старые замеры из БД?\n\nЭто действие необратимо и освободит память, но не повлияет на текущую статистику.')) {
                    performClearMetrics();
                }
            });

            async function performClearMetrics() {
                const btn = document.getElementById('clear-metrics');
                const originalHTML = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<span class="material-symbols-outlined text-[14px] animate-spin">progress_activity</span> Очистка...';

                try {
                    const resp = await fetch(routes.clearMetrics, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': window.getCsrfToken ? window.getCsrfToken() : '{{ csrf_token() }}'
                        }
                    });
                    const data = await resp.json();

                    if (data.ok) {
                        if (window.showToast) window.showToast('success', data.message || 'Метрики успешно очищены');
                        else alert(data.message || 'Метрики успешно очищены');
                        await refreshCharts();
                    } else {
                        if (window.showToast) window.showToast('danger', data.error || 'Ошибка очистки метрик');
                        else alert(data.error || 'Ошибка очистки метрик');
                    }
                } catch (e) {
                    console.error(e);
                    if (window.showToast) window.showToast('danger', 'Ошибка очистки метрик');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = originalHTML;
                }
            }

            document.querySelectorAll('.host-refresh-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const hostName = btn.getAttribute('data-host');
                    const targetSel = btn.getAttribute('data-target');
                    const metricsEl = document.querySelector(targetSel);
                    const idx = Array.from(document.querySelectorAll('.host-refresh-btn')).indexOf(btn) + 1;
                    const statusEl = document.getElementById(`host-status-${idx}`);
                    refreshHost(hostName, metricsEl, statusEl);
                });
            });

            document.querySelectorAll('.target-refresh-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetName = btn.getAttribute('data-target-name');
                    const targetSel = btn.getAttribute('data-target');
                    const metricsEl = document.querySelector(targetSel);
                    const idx = Array.from(document.querySelectorAll('.target-refresh-btn')).indexOf(btn) + 1;
                    const statusEl = document.getElementById(`target-status-${idx}`);
                    refreshTarget(targetName, metricsEl, statusEl);
                });
            });

            document.querySelectorAll('.period-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('is-active'));
                    btn.classList.add('is-active');
                    currentPeriod = parseInt(btn.getAttribute('data-period') || '6', 10);
                    refreshCharts();
                });
            });

            autoRefreshInterval = setInterval(refreshAll, 60000);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initMonitor);
        } else {
            initMonitor();
        }
    })();

</script>
