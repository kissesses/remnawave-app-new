<style>
    /* Custom Scrollbar for Logs */
    #logs-container::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }

    #logs-container::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 4px;
    }

    #logs-container::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        transition: background 0.2s;
    }

    #logs-container::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
    }

    #logs-container::-webkit-scrollbar-corner {
        background: transparent;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const activeSettingsTab = window.ACTIVE_SETTINGS_TAB || '';
        function bindEl(id, event, handler) {
            const el = document.getElementById(id);
            if (el) el.addEventListener(event, handler);
        }

        async function fetchSettingsJson(url, options = {}) {
            const headers = Object.assign({
                'Accept': 'application/json',
                'X-Requested-With': 'XMLHttpRequest',
            }, options.headers || {});
            if (options.method && options.method !== 'GET' && window.getCsrfToken) {
                headers['X-CSRFToken'] = window.getCsrfToken();
            }
            const resp = await fetch(url, Object.assign({ credentials: 'same-origin' }, options, { headers }));
            const contentType = resp.headers.get('content-type') || '';
            let data = {};
            if (resp.status === 401) {
                data = { ok: false, error: 'Требуется повторный вход в панель' };
            } else if (!contentType.includes('application/json')) {
                data = { ok: false, error: resp.redirected ? 'Требуется повторный вход в панель' : `Некорректный ответ сервера (${resp.status})` };
            } else {
                try {
                    data = await resp.json();
                } catch (_) {
                    data = { ok: false, error: `Некорректный ответ сервера (${resp.status})` };
                }
            }
            if (!resp.ok && data.ok !== false) {
                data = { ok: false, error: data.error || data.message || `Ошибка ${resp.status}` };
            }
            if (data.error === 'security_setup_required') {
                data.error = data.message || 'Завершите настройку защиты аккаунта';
            }
            if (data.error === 'auth_required') {
                data.error = data.message || 'Требуется повторный вход в панель';
            }
            return { resp, data };
        }

        const logsContainer = document.getElementById('logs-container');
        const logsStatusDot = document.getElementById('logs-status-dot');
        const logsStatusText = document.getElementById('logs-status-text');
        const btnClearLogs = document.getElementById('btn-clear-logs');

        async function copyLogsByLevel(level) {
            if (!logsContainer) return;
            const lines = Array.from(logsContainer.children);
            let filteredText = "";

            lines.forEach(line => {
                const text = line.textContent;
                if (level === 'ALL') {
                    filteredText += text + "\n";
                } else if (text.includes(level)) {
                    filteredText += text + "\n";
                }
            });

            if (!filteredText.trim()) {
                window.showToast('warning', 'Нет логов с уровнем ' + level);
                return;
            }

            try {
                await navigator.clipboard.writeText(filteredText);
                window.showToast('success', 'Логи (' + level + ') скопированы (' + filteredText.split('\n').length + ' стр.)');
            } catch (err) {
                console.error('Failed to copy logs:', err);
                window.showToast('danger', 'Ошибка копирования');
            }
        }
        window.copyLogsByLevel = copyLogsByLevel;

        let logEventSource = null;
        let logsOffset = 0;
        let isLoadingHistory = false;
        let isAutoScrolling = true;
        let logReconnectTimer = null;
        let logReconnectDelay = 5000;

        window.showConfirm = function ({
            title = 'Подтверждение',
            message = 'Вы уверены?',
            type = 'warning',
            confirmText = 'Подтвердить',
            cancelText = 'Отмена',
            onConfirm = null
        }) {
            return new Promise((resolve) => {
                const modal = document.getElementById('confirmModal');
                const iconContainer = document.getElementById('confirm-icon-container');
                const icon = document.getElementById('confirm-icon');
                const titleEl = document.getElementById('confirm-title');
                const messageEl = document.getElementById('confirm-message');
                const confirmBtn = document.getElementById('btn-confirm-ok');
                const cancelBtn = document.getElementById('btn-confirm-cancel');

                const styles = {
                    info: {
                        iconBg: 'bg-blue-500/20',
                        iconColor: 'text-blue-400',
                        iconName: 'info',
                        btnBg: 'bg-blue-500 hover:bg-blue-600 text-white'
                    },
                    warning: {
                        iconBg: 'bg-yellow-500/20',
                        iconColor: 'text-yellow-400',
                        iconName: 'warning',
                        btnBg: 'bg-yellow-500 hover:bg-yellow-600 text-white'
                    },
                    danger: {
                        iconBg: 'bg-red-500/20',
                        iconColor: 'text-red-400',
                        iconName: 'dangerous',
                        btnBg: 'bg-red-500 hover:bg-red-600 text-white'
                    }
                };

                const style = styles[type] || styles.warning;

                iconContainer.className = `w-16 h-16 rounded-full flex items-center justify-center ${style.iconBg}`;
                icon.className = `material-symbols-outlined text-4xl ${style.iconColor}`;
                icon.textContent = style.iconName;
                titleEl.textContent = title;
                messageEl.textContent = message;
                confirmBtn.textContent = confirmText;
                cancelBtn.textContent = cancelText;

                if (!cancelText) {
                    cancelBtn.style.display = 'none';
                } else {
                    cancelBtn.style.display = '';
                }

                confirmBtn.className = `flex-1 px-6 py-3 rounded-lg font-bold transition-colors ${style.btnBg}`;

                modal.style.display = 'flex';
                setTimeout(() => confirmBtn.focus(), 100);

                const handleConfirm = async () => {
                    modal.style.display = 'none';
                    cleanup();
                    if (onConfirm) await onConfirm();
                    resolve(true);
                };

                const handleCancel = () => {
                    modal.style.display = 'none';
                    cleanup();
                    resolve(false);
                };

                const handleKeyPress = (e) => {
                    if (e.key === 'Escape') handleCancel();
                    if (e.key === 'Enter') handleConfirm();
                };

                const cleanup = () => {
                    confirmBtn.onclick = null;
                    cancelBtn.onclick = null;
                    document.removeEventListener('keydown', handleKeyPress);
                };

                confirmBtn.onclick = handleConfirm;
                cancelBtn.onclick = handleCancel;
                document.addEventListener('keydown', handleKeyPress);
            });
        };

        function updateLogStatus(connected) {
            if (!logsStatusDot || !logsStatusText) return;
            if (connected) {
                logsStatusDot.className = 'w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.5)] animate-pulse';
                logsStatusText.textContent = 'Live';
                logsStatusText.className = 'text-[10px] uppercase tracking-widest font-bold text-green-400';
            } else {
                logsStatusDot.className = 'w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.5)]';
                logsStatusText.textContent = 'Disconnected';
                logsStatusText.className = 'text-[10px] uppercase tracking-widest font-bold text-white/40';
            }
        }

        function createLogLine(text) {
            const line = document.createElement('div');
            if (text.includes('[ERROR]') || text.includes('ERROR')) {
                line.className = 'whitespace-pre-wrap border-b border-white/5 pb-1 mb-1 hover:bg-red-500/20 bg-red-500/10 transition-colors px-1 text-red-300';
            } else if (text.includes('[WARNING]') || text.includes('WARNING')) {
                line.className = 'whitespace-pre-wrap border-b border-white/5 pb-1 mb-1 hover:bg-white/5 transition-colors px-1 text-yellow-300';
            } else {
                line.className = 'whitespace-pre-wrap border-b border-white/5 pb-1 mb-1 hover:bg-white/5 transition-colors px-1 text-white/80';
            }
            line.textContent = text;
            return line;
        }

        function appendLog(text) {
            if (!logsContainer) return;
            const line = createLogLine(text);
            line.classList.remove('log-line-cr');
            logsContainer.appendChild(line);

            if (isAutoScrolling) {
                logsContainer.scrollTop = logsContainer.scrollHeight;
            }

            if (logsContainer.children.length > 200) {
                logsContainer.removeChild(logsContainer.firstChild);
            }
        }

        function appendLogCR(text) {
            if (!logsContainer) return;
            const lastChild = logsContainer.lastElementChild;
            if (lastChild && lastChild.classList.contains('log-line-cr')) {
                lastChild.textContent = text;
                if (text.includes('[ERROR]') || text.includes('ERROR')) {
                    lastChild.className = 'log-line-cr whitespace-pre-wrap border-b border-white/5 pb-1 mb-1 hover:bg-red-500/20 bg-red-500/10 transition-colors px-1 text-red-300';
                } else if (text.includes('[WARNING]') || text.includes('WARNING')) {
                    lastChild.className = 'log-line-cr whitespace-pre-wrap border-b border-white/5 pb-1 mb-1 hover:bg-white/5 transition-colors px-1 text-yellow-300';
                } else {
                    lastChild.className = 'log-line-cr whitespace-pre-wrap border-b border-white/5 pb-1 mb-1 hover:bg-white/5 transition-colors px-1 text-white/80';
                }
            } else {
                const line = createLogLine(text);
                line.classList.add('log-line-cr');
                logsContainer.appendChild(line);
            }

            if (isAutoScrolling) {
                logsContainer.scrollTop = logsContainer.scrollHeight;
            }

            if (logsContainer.children.length > 200) {
                logsContainer.removeChild(logsContainer.firstChild);
            }
        }

        let currentSearchIndex = -1;
        let searchResults = [];

        function performLogsSearch() {
            const query = document.getElementById('logs-search-input').value.toLowerCase();
            const countEl = document.getElementById('logs-search-count');
            const lines = Array.from(logsContainer.querySelectorAll('div:not(.text-center)'));

            searchResults = [];
            currentSearchIndex = -1;

            lines.forEach(line => {
                line.classList.remove('bg-primary/20', 'border-primary/40');
                const text = line.textContent.toLowerCase();
                if (query && text.includes(query)) {
                    searchResults.push(line);
                }
            });

            if (query && searchResults.length > 0) {
                countEl.classList.remove('hidden');
                currentSearchIndex = 0;
                updateSearchUI();
                scrollToSearchResult();
            } else {
                countEl.classList.add('hidden');
            }
        }

        function updateSearchUI() {
            const query = document.getElementById('logs-search-input').value.toLowerCase();
            const countEl = document.getElementById('logs-search-count');
            countEl.textContent = `${currentSearchIndex + 1}/${searchResults.length}`;

            searchResults.forEach((el, idx) => {
                el.classList.toggle('bg-primary/30', idx === currentSearchIndex);
                el.classList.toggle('bg-primary/10', idx !== currentSearchIndex && query && el.textContent.toLowerCase().includes(query));
            });
        }

        function scrollToSearchResult() {
            if (currentSearchIndex >= 0 && searchResults[currentSearchIndex]) {
                isAutoScrolling = false;
                searchResults[currentSearchIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                searchResults.forEach(el => el.classList.remove('bg-primary/30', 'ring-1', 'ring-primary'));
                searchResults[currentSearchIndex].classList.add('bg-primary/30', 'ring-1', 'ring-primary');
            }
        }

        bindEl('logs-search-input', 'input', performLogsSearch);
        bindEl('btn-logs-search-next', 'click', () => {
            if (searchResults.length > 0) {
                currentSearchIndex = (currentSearchIndex + 1) % searchResults.length;
                updateSearchUI();
                scrollToSearchResult();
            }
        });
        bindEl('btn-logs-search-prev', 'click', () => {
            if (searchResults.length > 0) {
                currentSearchIndex = (currentSearchIndex - 1 + searchResults.length) % searchResults.length;
                updateSearchUI();
                scrollToSearchResult();
            }
        });

        function prependLog(text) {
            if (!logsContainer) return;
            const line = createLogLine(text);
            logsContainer.insertBefore(line, logsContainer.firstChild);
        }

        async function loadHistory(linesCount = 50) {
            if (!logsContainer || isLoadingHistory) return;
            isLoadingHistory = true;

            const currentLines = Array.from(logsContainer.children).filter(el => !el.classList.contains('history-loader-status')).length;

            const loading = document.createElement('div');
            loading.className = 'history-loader-status text-center text-xs text-white/30 py-1';
            loading.innerHTML = '<span class="material-symbols-outlined animate-spin text-sm">progress_activity</span> <span class="text-[10px] uppercase font-bold tracking-widest">Загрузка истории...</span>';
            logsContainer.insertBefore(loading, logsContainer.firstChild);

            try {
                const resp = await fetch(`/settings/logs/history?lines=${linesCount}&offset=${currentLines}`);
                const data = await resp.json();

                if (logsContainer.contains(loading)) logsContainer.removeChild(loading);

                if (data.ok && data.lines && data.lines.length > 0) {
                    const oldHeight = logsContainer.scrollHeight;
                    const oldScroll = logsContainer.scrollTop;

                    const fragment = document.createDocumentFragment();
                    data.lines.forEach(lineText => {
                        fragment.appendChild(createLogLine(lineText));
                    });

                    logsContainer.insertBefore(fragment, logsContainer.firstChild);

                    if (linesCount <= 50) {
                        const newHeight = logsContainer.scrollHeight;
                        logsContainer.scrollTop = oldScroll + (newHeight - oldHeight);
                    } else {
                        window.showToast('success', `Загружено ${data.lines.length} строк истории`);
                        performLogsSearch();
                    }
                } else if (linesCount > 50) {
                    window.showToast('info', 'Больше нет доступной истории');
                }
            } catch (e) {
                console.error("History error:", e);
                if (logsContainer.contains(loading)) logsContainer.removeChild(loading);
            } finally {
                isLoadingHistory = false;
            }
        }

        window.loadMoreLogsHistory = function () {
            loadHistory(200);
        };

        if (logsContainer) {
        logsContainer.addEventListener('scroll', () => {
            if (logsContainer.scrollTop + logsContainer.clientHeight < logsContainer.scrollHeight - 50) {
                isAutoScrolling = false;
            } else {
                isAutoScrolling = true;
            }

            if (logsContainer.scrollTop < 50) {
                loadHistory();
            }
        });
        }

        function startLogStream() {
            if (logEventSource) logEventSource.close();
            if (logReconnectTimer) {
                clearTimeout(logReconnectTimer);
                logReconnectTimer = null;
            }

            if (logsContainer) logsContainer.innerHTML = '';
            updateLogStatus(true);

            logEventSource = new EventSource('/settings/logs/stream');

            logEventSource.onmessage = function (event) {
                logReconnectDelay = 5000;
                const data = event.data;
                if (data.startsWith('\x01CR\x01')) {
                    appendLogCR(data.substring(4));
                } else {
                    appendLog(data);
                }
            };

            logEventSource.onerror = function (err) {
                console.warn("Log stream disconnected. Reconnecting...");
                logEventSource.close();
                logEventSource = null;
                updateLogStatus(false);
                appendLog(`[System] Connection lost. Reconnecting in ${Math.round(logReconnectDelay / 1000)}s...`);
                logReconnectTimer = setTimeout(() => {
                    logReconnectTimer = null;
                    logReconnectDelay = Math.min(logReconnectDelay * 2, 60000);
                    if (activeSettingsTab === 'logs') startLogStream();
                }, logReconnectDelay);
            };
        }

        let isLogsFullscreen = false;

        window.toggleLogsFullscreen = function () {
            const container = document.getElementById('logs-wrapper');
            if (!container) return;

            if (!isLogsFullscreen) {
                if (container.requestFullscreen) {
                    container.requestFullscreen().catch(err => {
                        console.error(`Error attempting to enable fullscreen: ${err.message}`);
                    });
                } else {
                    enterCssFullscreen(container);
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else {
                    exitCssFullscreen(container);
                }
            }
        };

        function enterCssFullscreen(el) {
            el.classList.add('fixed', 'inset-0', 'z-[100]', 'h-screen', 'w-screen', 'rounded-none', 'flex', 'flex-col', 'bg-[#0a1812]', 'overflow-hidden', 'p-6');
            el.classList.remove('p-1.5', 'rounded-2xl', 'backdrop-blur-xl', 'bg-white/5');

            const mainContainer = el.firstElementChild;
            if (mainContainer) {
                mainContainer.classList.remove('p-5');
                mainContainer.classList.add('flex', 'flex-col', 'h-full', 'w-full');
            }

            const terminalWrapper = el.querySelector('.group\\/terminal');
            if (terminalWrapper) {
                terminalWrapper.classList.add('flex-1', 'flex', 'flex-col', 'min-h-0');
            }

            const inner = el.querySelector('#logs-container');
            if (inner) {
                inner.classList.add('flex-1', 'min-h-0', 'rounded-xl', 'border', 'border-white/5', 'overflow-y-auto');
                inner.classList.remove('h-[55vh]');
            }

            const header = el.querySelector('.flex.flex-col');
            if (header) {
                header.classList.add('mb-4', 'flex-none');
            }

            const footer = el.querySelector('.mt-4.flex');
            if (footer) {
                footer.classList.add('hidden');
            }

            document.body.style.overflow = 'hidden';
            isLogsFullscreen = true;
            updateFullscreenIcon(true);
        }

        function exitCssFullscreen(el) {
            el.classList.remove('fixed', 'inset-0', 'z-[100]', 'h-screen', 'w-screen', 'rounded-none', 'flex', 'flex-col', 'bg-[#0a1812]', 'overflow-hidden', 'p-6');
            el.classList.add('p-1.5', 'rounded-2xl', 'backdrop-blur-xl', 'bg-white/5');

            const mainContainer = el.firstElementChild;
            if (mainContainer) {
                mainContainer.classList.add('p-5');
                mainContainer.classList.remove('flex', 'flex-col', 'h-full', 'w-full');
            }

            const terminalWrapper = el.querySelector('.group\\/terminal');
            if (terminalWrapper) {
                terminalWrapper.classList.remove('flex-1', 'flex', 'flex-col', 'min-h-0');
            }

            const inner = el.querySelector('#logs-container');
            if (inner) {
                inner.classList.remove('flex-1', 'min-h-0');
                inner.classList.add('h-[55vh]', 'rounded-xl', 'border', 'border-white/5', 'overflow-y-auto');
            }

            const header = el.querySelector('.flex.flex-col');
            if (header) {
                header.classList.remove('mb-4', 'flex-none');
            }

            const footer = el.querySelector('.mt-4.flex');
            if (footer) {
                footer.classList.remove('hidden');
            }

            document.body.style.overflow = '';
            isLogsFullscreen = false;
            updateFullscreenIcon(false);
        }

        document.addEventListener('fullscreenchange', () => {
            const container = document.getElementById('logs-wrapper');
            if (!container) return;

            if (document.fullscreenElement) {
                enterCssFullscreen(container);
            } else {
                exitCssFullscreen(container);
            }
        });

        function updateFullscreenIcon(isFullscreen) {
            const btn = document.getElementById('btn-fullscreen-logs');
            if (!btn) return;
            const icon = btn.querySelector('.material-symbols-outlined');
            if (isFullscreen) {
                icon.textContent = 'close_fullscreen';
                btn.title = 'Выйти из полноэкранного режима (F11 / Esc)';
            } else {
                icon.textContent = 'open_in_full';
                btn.title = 'На весь экран (F11)';
            }
        }

        document.addEventListener('keydown', function (e) {
            if (e.key === 'F11' && activeSettingsTab === 'logs') {
                    e.preventDefault();
                    toggleLogsFullscreen();
            }
        });

        let uploadedMediaFilename = null;

        if (btnClearLogs) {
            btnClearLogs.addEventListener('click', async () => {
                const confirmed = await window.showConfirm({
                    title: 'Очистка логов Docker',
                    message: 'Вы уверены, что хотите очистить все логи Docker?\n\nЭто действие необратимо.',
                    type: 'danger',
                    confirmText: 'Очистить',
                    cancelText: 'Отмена'
                });
                if (!confirmed) return;

                try {
                    const resp = await fetch('/settings/logs/clear', {
                        method: 'POST',
                        headers: {
                            'X-CSRFToken': window.getCsrfToken()
                        }
                    });
                    const data = await resp.json();

                    if (data.ok) {
                        window.showToast('success', 'Логи успешно очищены');
                        if (logsContainer) logsContainer.innerHTML = '<div class="text-green-400 text-center my-4">--- Логи были очищены ---</div>';
                    } else {
                        window.showToast('danger', data.error || 'Ошибка очистки логов');
                    }
                } catch (e) {
                    console.error(e);
                    window.showToast('danger', 'Ошибка соединения');
                }
            });
        }

        let buttons = [];
        const broadcastMainBotRunning = {{ 'true' if main_running else 'false' }};

        async function readBroadcastError(resp, fallback) {
            try {
                const contentType = resp.headers.get('content-type') || '';
                if (contentType.includes('application/json')) {
                    const data = await resp.json();
                    if (data.error) return data.error;
                    if (data.message) return data.message;
                }
            } catch (_) { /* ignore parse errors */ }
            return fallback;
        }

        function ensureBroadcastBotRunning() {
            if (broadcastMainBotRunning) return true;
            window.showToast('warning', 'Сначала запустите основного бота в панели управления');
            return false;
        }

        function pluralUsers(count) {
            const n = Math.abs(Number(count) || 0);
            const mod10 = n % 10;
            const mod100 = n % 100;
            if (mod10 === 1 && mod100 !== 11) return `${n} пользователь`;
            if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return `${n} пользователя`;
            return `${n} пользователей`;
        }

        function getSelectedExpiringDays() {
            const selected = document.querySelector('input[name="expiring_days"]:checked');
            return selected ? parseInt(selected.value, 10) : 3;
        }

        function getBroadcastRecipientCount(mode, stats) {
            if (!stats) return 0;
            switch (mode) {
                case 'all':
                    return stats.total_users || 0;
                case 'with_keys':
                    return stats.users_with_keys || 0;
                case 'expired_keys':
                    return stats.users_with_expired_keys || 0;
                case 'without_trial':
                    return (stats.total_users || 0) - (stats.users_without_trial || 0);
                case 'not_used_trial':
                    return stats.users_without_trial || 0;
                case 'test':
                    return 1;
                case 'expiring_keys': {
                    const days = getSelectedExpiringDays();
                    return stats.expiring_counts?.[days] ?? stats.expiring_counts?.[String(days)] ?? 0;
                }
                default:
                    return 0;
            }
        }

        const broadcastModeLabels = {
            all: 'все пользователи',
            with_keys: 'пользователи с активными ключами',
            expired_keys: 'пользователи с истекшими ключами',
            without_trial: 'пользователи, уже использовавшие триал',
            not_used_trial: 'пользователи, не использовавшие триал',
            test: 'только администратор (тестовая отправка)',
            expiring_keys: 'пользователи с ключами, срок которых скоро истекает',
        };

        function updateExpiringModeCount() {
            const stats = window.broadcastStats;
            const el = document.getElementById('count-mode-expiring_keys');
            if (!el || !stats) return;
            const count = getBroadcastRecipientCount('expiring_keys', stats);
            el.textContent = `(${count})`;
        }

        function updateBroadcastRecipientSummary() {
            const summaryEl = document.getElementById('broadcast-recipient-summary-text');
            if (!summaryEl) return;

            const modeInput = document.querySelector('input[name="mode"]:checked');
            const mode = modeInput ? modeInput.value : 'all';
            const stats = window.broadcastStats;

            if (!stats) {
                summaryEl.textContent = 'Загрузка статистики…';
                return;
            }

            let count = getBroadcastRecipientCount(mode, stats);
            const skipBannedToggle = document.getElementById('skip-banned-toggle');
            if (skipBannedToggle?.checked && mode !== 'test') {
                const banned = window.currentBannedCount || 0;
                count = Math.max(0, count - banned);
            }

            let audienceLabel = broadcastModeLabels[mode] || mode;
            if (mode === 'expiring_keys') {
                const days = getSelectedExpiringDays();
                audienceLabel += ` (в ближайшие ${days} ${days === 1 ? 'день' : days < 5 ? 'дня' : 'дней'})`;
            }

            summaryEl.textContent = `${pluralUsers(count)} — ${audienceLabel}`;
            const railSummary = document.getElementById('broadcast-recipient-summary-rail');
            if (railSummary) railSummary.textContent = summaryEl.textContent;
        }

        function broadcastDeliveryPercent(run) {
            const total = Number(run?.total_recipients) || 0;
            const sent = Number(run?.sent_count) || 0;
            if (!total) return 0;
            return Math.min(100, Math.round((sent / total) * 100));
        }

            return broadcastHistoryModeIcons[mode] || { icon: 'campaign', cls: 'all' };
        }

        function formatBroadcastDate(value) {
            if (!value) return '—';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return String(value);
            return date.toLocaleString('ru-RU');
        }

        function renderBroadcastHistoryBreakdown(breakdown, reasonLabels) {
            const wrap = document.getElementById('broadcast-history-breakdown');
            if (!wrap) return;
            const chips = [];
            Object.entries(breakdown || {}).forEach(([status, reasons]) => {
                Object.entries(reasons || {}).forEach(([reason, count]) => {
                    if (!count) return;
                    const reasonLabel = reason === '_none'
                        ? (status === 'sent' ? 'Доставлено' : '—')
                        : (reasonLabels?.[reason] || reason);
                    const filterStatus = status === 'sent' || status === 'failed' || status === 'skipped' ? status : 'all';
                    const filterReason = reason === '_none' ? 'all' : reason;
                    chips.push(
                        `<button type="button" class="broadcast-history-chip" data-filter-status="${filterStatus}" data-filter-reason="${filterReason}">${reasonLabel}: ${count}</button>`
                    );
                });
            });
            wrap.innerHTML = chips.join('') || '<span class="broadcast-history-chip" style="cursor:default;opacity:0.6">Нет детализации</span>';

            wrap.querySelectorAll('.broadcast-history-chip[data-filter-status]').forEach((chip) => {
                chip.addEventListener('click', () => {
                    const statusEl = document.getElementById('broadcast-history-filter-status');
                    const reasonEl = document.getElementById('broadcast-history-filter-reason');
                    if (statusEl) statusEl.value = chip.dataset.filterStatus || 'all';
                    if (reasonEl) reasonEl.value = chip.dataset.filterReason || 'all';
                    if (broadcastHistoryState.selectedId) {
                        openBroadcastHistoryDetail(broadcastHistoryState.selectedId, 1);
                    }
                });
            });
        }

        function renderBroadcastHistoryDetail(data) {
            broadcastHistoryState.reasonLabels = data.reason_labels || {};
            broadcastHistoryState.statusLabels = data.status_labels || {};

            const run = data.run || {};
            setBroadcastHistoryModalHeader('detail', run);
            document.getElementById('broadcast-history-detail-title').textContent = run.mode_label || 'Рассылка';
            const finished = run.finished_at ? ` · завершено ${formatBroadcastDate(run.finished_at)}` : '';
            document.getElementById('broadcast-history-detail-meta').textContent =
                `${formatBroadcastDate(run.started_at)}${finished} · аудитория: ${run.total_recipients || 0}`;
            document.getElementById('broadcast-history-detail-preview').textContent = run.text_preview || '—';

            renderBroadcastHistoryStats(run);
            renderBroadcastHistoryBreakdown(data.breakdown, data.reason_labels);
            renderBroadcastHistoryDeliveries(data.deliveries || []);

            document.querySelectorAll('.broadcast-history-card').forEach((card) => {
                card.classList.toggle('is-active', card.dataset.broadcastId === broadcastHistoryState.selectedId);
            });

            const infoEl = document.getElementById('broadcast-history-pagination-info');
            if (infoEl) {
                infoEl.textContent = `Страница ${data.page} из ${data.pages} · всего ${data.total}`;
            }
            const prevBtn = document.getElementById('broadcast-history-prev');
            const nextBtn = document.getElementById('broadcast-history-next');
            if (prevBtn) prevBtn.disabled = (data.page || 1) <= 1;
            if (nextBtn) nextBtn.disabled = (data.page || 1) >= (data.pages || 1);

        async function fetchBroadcastHistoryDetail(broadcastId, page = 1) {
            const status = document.getElementById('broadcast-history-filter-status')?.value || 'all';
            const reason = document.getElementById('broadcast-history-filter-reason')?.value || 'all';
            const search = document.getElementById('broadcast-history-search')?.value?.trim() || '';
            const params = new URLSearchParams({
                page: String(page),
                per_page: String(broadcastHistoryState.perPage),
                status,
                reason,
            });
            if (search) params.set('q', search);
            return fetchSettingsJson(`/settings/broadcast/history/${encodeURIComponent(broadcastId)}?${params}`);
        }

        async function loadBroadcastHistoryList() {
            openBroadcastHistoryPanel();
            resetBroadcastHistoryView('list');
            setBroadcastHistoryLoading(true);

            try {
                const { data } = await fetchSettingsJson('/settings/broadcast/history?limit=30');
                setBroadcastHistoryLoading(false);
                if (!data.ok) {
                    window.showToast?.('danger', data.error || 'Не удалось загрузить историю');
                    return;
                }
                renderBroadcastHistoryList(data.items || []);
            } catch (e) {
                setBroadcastHistoryLoading(false);
                console.error('Failed to load broadcast history:', e);
                window.showToast?.('danger', 'Ошибка загрузки истории рассылок');
            }
        }

        async function openBroadcastHistoryDetail(broadcastId, page = 1) {
            if (!broadcastId) return;
            broadcastHistoryState.selectedId = broadcastId;
            broadcastHistoryState.page = page;

            openBroadcastHistoryModal();
            resetBroadcastHistoryView('detail');
            setBroadcastHistoryLoading(true);

            try {
                const { data } = await fetchBroadcastHistoryDetail(broadcastId, page);
                setBroadcastHistoryLoading(false);
                if (!data.ok) {
                    window.showToast?.('danger', data.error || 'Не удалось загрузить детали');
                    resetBroadcastHistoryView('list');
                    await loadBroadcastHistoryList();
                    return;
                }
                renderBroadcastHistoryDetail(data);
            } catch (e) {
                setBroadcastHistoryLoading(false);
                console.error('Failed to load broadcast detail:', e);
                window.showToast?.('danger', 'Ошибка загрузки деталей рассылки');
                resetBroadcastHistoryView('list');
            }
        }

        async function showBroadcastHistoryAfterComplete(broadcastId) {
            if (!broadcastId) {
                await loadBroadcastHistoryList();
                return;
            }

            openBroadcastHistoryPanel();
            resetBroadcastHistoryView('detail');
            setBroadcastHistoryLoading(true);

            for (let attempt = 0; attempt < 6; attempt++) {
                try {
                    const { data } = await fetchBroadcastHistoryDetail(broadcastId, 1);
                    if (data.ok && data.run) {
                        broadcastHistoryState.selectedId = broadcastId;
                        broadcastHistoryState.page = 1;
                        setBroadcastHistoryLoading(false);
                        renderBroadcastHistoryDetail(data);
                        return;
                    }
                } catch (e) {
                    console.warn('Broadcast history retry', attempt + 1, e);
                }
                await new Promise((resolve) => setTimeout(resolve, 350 * (attempt + 1)));
            }

            setBroadcastHistoryLoading(false);
            window.showToast?.('info', 'Открываем список рассылок…');
            await loadBroadcastHistoryList();
        }

                    if (document.getElementById('count-mode-not_used_trial')) document.getElementById('count-mode-not_used_trial').textContent = `(${data.users_without_trial})`;

        bindEl('btn-upload-media', 'click', () => {
            document.getElementById('media-input')?.click();
        });

        bindEl('media-input', 'change', async function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const maxSize = 500 * 1024 * 1024;
            if (file.size > maxSize) {
                window.showToast('danger', `Файл слишком большой. Максимальный размер: 500 МБ. Размер вашего файла: ${(file.size / 1024 / 1024).toFixed(2)} МБ`);
                e.target.value = '';
                return;
            }

            const formData = new FormData();
            formData.append('file', file);
            formData.append('csrf_token', window.getCsrfToken());

            try {
                const loading = document.createElement('p');
                loading.textContent = 'Загрузка...';
                loading.className = 'text-white/50 text-sm mt-2';
                e.target.parentElement.appendChild(loading);

                const resp = await fetch('/settings/broadcast/upload', {
                    method: 'POST',
                    body: formData
                });

                loading.remove();

                if (!resp.ok) {
                    if (resp.status === 413) {
                        window.showToast('danger', 'Файл слишком большой для загрузки. Максимальный размер: 500 МБ');
                    } else {
                        window.showToast('danger', `Ошибка сервера: ${resp.status} ${resp.statusText}`);
                    }
                    e.target.value = '';
                    return;
                }

                const data = await resp.json();

                if (data.ok) {
                    uploadedMediaFilename = data.filename;
                    const preview = document.getElementById('media-preview');
                    const img = document.getElementById('media-preview-img');
                    const video = document.getElementById('media-preview-video');

                    preview.classList.remove('hidden');

                    if (data.media_type === 'photo' || data.media_type === 'animation') {
                        img.src = URL.createObjectURL(file);
                        img.classList.remove('hidden');
                        video.classList.add('hidden');
                    } else if (data.media_type === 'video') {
                        video.src = URL.createObjectURL(file);
                        video.classList.remove('hidden');
                        img.classList.add('hidden');
                    }

                    window.showToast('success', 'Медиа загружено');
                } else {
                    window.showToast('danger', data.error || 'Ошибка загрузки');
                }
            } catch (err) {
                console.error(err);
                window.showToast('danger', 'Ошибка загрузки медиа');
            }
        });

        bindEl('btn-remove-media', 'click', async () => {

            try {

                    btn.disabled = false;
                    btn.innerHTML = BROADCAST_SEND_BTN_HTML;

                                }, 2000);
                            } else {

                                setTimeout(() => pollStatus(taskId), 2000);
                            }
                        } catch (e) {
                            if (e.name === 'TypeError') {
                                setTimeout(() => pollStatus(taskId), 5000);

        const textarea = document.getElementById('broadcast-text');
        if (!textarea) return;

        if (tag === 'a') {
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            window._broadcastSelection = { start, end };

            const linkInput = document.getElementById('link-url-input');
            if (linkInput) {
                linkInput.value = 'https://';
                openModal('linkModal');
                setTimeout(() => linkInput.focus(), 100);

            return;

        if (tag === 'tg-emoji') {
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            window._broadcastSelection = { start, end };

            const emojiInput = document.getElementById('emoji-id-input');
            if (emojiInput) {
                emojiInput.value = '';
                openModal('emojiModal');
                setTimeout(() => emojiInput.focus(), 100);
            }
            return;
        }

        let startTag = `<${tag}>`;
        let endTag = `</${tag}>`;

        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const text = textarea.value;
        const selected = text.substring(start, end);

        const replacement = startTag + selected + endTag;

        textarea.setRangeText(replacement, start, end, 'select');
        textarea.focus();
    };

            document.querySelectorAll('.webapp-panel-design-card').forEach((card) => {
                const cb = card.querySelector('.webapp-design-checkbox');
                card.classList.toggle('is-enabled', !!cb?.checked);
            });
            if (!webappDefaultSelect) return;
            const enabled = Array.from(document.querySelectorAll('.webapp-design-checkbox:checked')).map((el) => el.value);
            let hasVisible = false;
            Array.from(webappDefaultSelect.options).forEach((opt) => {
                const ok = enabled.includes(opt.value);
                opt.hidden = !ok;
                opt.disabled = !ok;
                if (ok) hasVisible = true;
            });
            if (!enabled.includes(webappDefaultSelect.value) && enabled.length) {
                webappDefaultSelect.value = enabled[0];
            }
            if (!hasVisible && webappDefaultSelect.options.length) {
                webappDefaultSelect.selectedIndex = 0;
            }
        }

        document.querySelectorAll('.webapp-design-checkbox').forEach((cb) => {
            cb.addEventListener('change', () => {
                if (!document.querySelector('.webapp-design-checkbox:checked')) {
                    cb.checked = true;
                    window.showToast?.('warning', 'Должен быть включён хотя бы один дизайн');
                }
                syncWebappDesignCards();
            });
        });
        syncWebappDesignCards();

        if (webappForm) {
            webappForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const btn = document.getElementById('btn-save-webapp');
                const originalHtml = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-sm">progress_activity</span> Сохранение...';

                const formData = new FormData();
                formData.append('csrf_token', window.getCsrfToken());
                formData.append('enable', document.getElementById('webapp_enable').checked);
                formData.append('tg_fullscreen', document.getElementById('tg_fullscreen').checked);
                formData.append('theme_picker', document.getElementById('webapp_theme_picker').checked);
                formData.append('title', document.getElementById('webapp_title').value);
                formData.append('domen', document.getElementById('webapp_domen').value);
                formData.append('logo', document.getElementById('webapp_logo').value);
                formData.append('icon', document.getElementById('webapp_icon').value);
                formData.append('default_design', webappDefaultSelect?.value || 'classic');
                document.querySelectorAll('.webapp-design-checkbox:checked').forEach((el) => {
                    formData.append('webapp_design_enabled', el.value);
                });

                try {
                    const resp = await fetch('/settings/webapp/save', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await resp.json();

                    if (data.ok) {
                        window.showToast('success', 'Настройки Web App сохранены');
                    } else {
                        window.showToast('danger', data.error || 'Ошибка сохранения');
                    }
                } catch (err) {
                    console.error(err);
                    window.showToast('danger', 'Ошибка подключения');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = originalHtml;
                }
            });
        };

        if ((window.ACTIVE_SETTINGS_TAB || '') === 'broadcast') {
            window.loadBroadcastThemes();
        }
    });
</script>
