<!-- ===== СЕКЦИЯ: Speedtest SSH ===== -->
<section class="mb-8">
    <div class="bg-[#0c0818]/70 border border-white/10 rounded-[1.4rem] shadow-2xl shadow-black/30 backdrop-blur-2xl overflow-hidden relative z-20">
        <div class="relative overflow-hidden border-b border-white/10 bg-gradient-to-br from-primary/[0.07] via-white/[0.025] to-transparent">
            <div class="absolute -top-14 -right-10 w-32 h-32 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-10 -left-10 w-24 h-24 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
            <div class="relative z-10 px-5 py-3.5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-primary/10 border border-primary/15 flex items-center justify-center text-primary shadow-lg shadow-primary/5 shrink-0">
                        <span class="material-symbols-outlined text-lg">speed</span>
                    </div>
                    <div>
                        <h3 class="text-sm font-black text-white tracking-tight leading-tight">Speedtest SSH</h3>
                        <p class="text-[9px] font-bold text-white/30 uppercase tracking-[0.18em] mt-0.5">Проверка скорости на серверах</p>
                    </div>
                </div>

                <div class="bg-black/25 border border-white/[0.06] rounded-xl px-3.5 py-2 flex items-center sm:items-start justify-center min-w-[140px] w-full sm:w-auto h-fit">
                    <div class="flex flex-col items-center sm:items-start w-full">
                        <span class="text-[9px] font-black text-white/25 uppercase tracking-[0.18em] block mb-1">Последний замер:
                            <span id="st-latest-date" class="text-white/40 normal-case tracking-normal ml-1">—</span></span>
                        <div id="st-latest"
                            class="text-[11px] text-white font-bold text-center sm:text-left leading-relaxed break-words whitespace-normal mt-0.5">
                            —
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="p-5">
            <div class="flex flex-col lg:flex-row items-start justify-between gap-5 mb-5">
                <div class="flex-1 w-full">
                    <div class="grid grid-cols-1 gap-3">
                        <div>
                            <div class="flex items-center justify-between mb-1.5 ml-0.5">
                                <label class="block text-white/30 text-[9px] uppercase font-black tracking-[0.18em]">SSH цель</label>
                                <span id="st-target-ip" class="text-[9px] text-white/25 font-mono font-bold tracking-wider ml-2"
                                    title="IP адрес выбранного сервера">IP: —</span>
                            </div>
                            <div class="soft-select w-full" data-target="st-target">
                                <button type="button"
                                    class="soft-select-toggle w-full text-left bg-black/30 border border-white/[0.08] rounded-xl px-3 py-2.5 text-white text-xs font-bold focus:ring-1 focus:ring-primary/30 transition-all flex items-center justify-between"
                                    id="st_target_toggle">
                                    <span>Выберите сервер...</span>
                                    <span class="material-symbols-outlined text-white/30 text-sm">expand_more</span>
                                </button>
                                <div class="soft-select-menu" id="st_target_menu"></div>
                                <select id="st-target" class="hidden">
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-2.5 w-full lg:w-auto mt-auto">
                    <form id="st-run-form" method="post" class="m-0 w-full sm:w-auto">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
                        <input type="hidden" name="method" value="both" />
                        <button type="submit"
                            class="w-full sm:w-auto px-4 py-2 rounded-xl bg-primary/10 border border-primary/15 text-primary font-black text-[9px] uppercase tracking-[0.18em] hover:bg-primary hover:text-background-dark transition-all flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined text-[14px]">play_arrow</span>
                            Проверить
                        </button>
                    </form>

                    <form id="st-run-all-form" action="{{ url_for('node_run_all_ssh_target_speedtests_route') }}" method="post"
                        class="m-0 w-full sm:w-auto">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
                        <button type="submit"
                            class="w-full sm:w-auto px-4 py-2 rounded-xl bg-white/[0.03] border border-white/[0.08] text-white/60 font-black text-[9px] uppercase tracking-[0.18em] hover:bg-white/[0.08] hover:text-white transition-all flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined text-[14px]">playlist_play</span>
                            Запустить все
                        </button>
                    </form>
                </div>
            </div>

            <div class="h-64 bg-black/20 rounded-xl border border-white/[0.05] p-4">
                <canvas id="st-top-canvas"></canvas>
            </div>
        </div>
    </div>
</section>
