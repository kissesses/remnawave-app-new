{# Shared auth pages: login + mandatory 2FA setup #}
{% set av = (project_info.version if project_info is mapping and project_info.get('version') else '') or '' %}
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
<link href="{{ url_for('static', filename='css/auth-ios.css') }}{% if av %}?v={{ av }}{% endif %}" rel="stylesheet" />
<link href="{{ url_for('static', filename='css/panel-switches.css') }}{% if av %}?v={{ av }}{% endif %}" rel="stylesheet" />
<link href="{{ url_for('static', filename='css/auth-classic.css') }}{% if av %}?v={{ av }}{% endif %}" rel="stylesheet" />
<link href="{{ url_for('static', filename='css/auth-macos.css') }}{% if av %}?v={{ av }}{% endif %}" rel="stylesheet" />
<link href="{{ url_for('static', filename='css/auth-glass-stealth.css') }}{% if av %}?v={{ av }}{% endif %}" rel="stylesheet" />
<link href="{{ url_for('static', filename='css/panel-macos.css') }}{% if av %}?v={{ av }}{% endif %}" rel="stylesheet" />
<link href="{{ url_for('static', filename='css/panel-light.css') }}{% if av %}?v={{ av }}{% endif %}" rel="stylesheet" />
{% if auth_security_setup_page %}
<link href="{{ url_for('static', filename='css/auth-security-setup.css') }}{% if av %}?v={{ av }}{% endif %}" rel="stylesheet" />
{% endif %}
<style>
    /* Critical fallback if a stylesheet fails to load */
    body.auth-ios {
        margin: 0;
        min-height: 100vh;
        background: #000;
        color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
    }
    body.auth-ios .modal-overlay:not(.open) { display: none !important; }
    body.auth-security-setup .auth-macos-profile,
    body.auth-security-setup .auth-security-classic-head,
    body.auth-security-setup .auth-security-glass-head { display: none; }
    html[data-design="classic"] body.auth-security-setup .auth-security-classic-head { display: block; }
    html[data-design="macos"] body.auth-security-setup .auth-macos-profile,
    html[data-design="macos-v2"] body.auth-security-setup .auth-macos-profile {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }
    html[data-design="glass"] body.auth-security-setup .auth-security-glass-head,
    html[data-design="stealth-admin"] body.auth-security-setup .auth-security-glass-head { display: block; }
</style>
<script>
    (function () {
        const theme = localStorage.getItem('theme') || 'dark';
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        const design = localStorage.getItem('design-theme') || 'classic';
        document.documentElement.dataset.design = design;
        if (design !== 'stealth-admin') {
            const accents = {
                blue: { c: '#0a84ff', r: '10, 132, 255' },
                violet: { c: '#8b5cf6', r: '139, 92, 246' },
                rose: { c: '#f43f5e', r: '244, 63, 94' },
                emerald: { c: '#10b981', r: '16, 185, 129' },
                cyan: { c: '#06b6d4', r: '6, 182, 212' },
                amber: { c: '#f59e0b', r: '245, 158, 11' },
                red: { c: '#ef4444', r: '239, 68, 68' },
            };
            const key = localStorage.getItem('panel-accent') || 'blue';
            const a = accents[key] || accents.blue;
            const root = document.documentElement;
            const soft = 'rgba(' + a.r + ', 0.16)';
            root.style.setProperty('--primary', a.c);
            root.style.setProperty('--primary-rgb', a.r);
            root.style.setProperty('--panel-accent', a.c);
            root.style.setProperty('--panel-accent-soft', soft);
            root.style.setProperty('--auth-accent', a.c);
            root.style.setProperty('--auth-accent-soft', soft);
        }
    })();
</script>
