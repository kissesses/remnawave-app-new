<!-- Speedtest + user group modals -->
<div id="speedtestRunningModal" class="modal-overlay">
    <div class="modal-content bg-[#0b0f0e]/95 border border-primary/10 rounded-[1.4rem] shadow-2xl shadow-black/40 backdrop-blur-2xl p-6">
        <div class="flex items-center gap-4">
            <div class="relative w-9 h-9 shrink-0">
                <div class="absolute inset-0 rounded-full border border-primary/20"></div>
                <div class="absolute inset-0.5 rounded-full border-2 border-white/5 border-t-primary animate-spin"></div>
            </div>
            <div>
                <div class="text-sm font-black text-white tracking-tight">Идёт измерение скорости…</div>
                <div class="text-white/35 text-[10px] font-bold mt-0.5">Пожалуйста, подождите 10–30 секунд</div>
            </div>
        </div>
    </div>
</div>

<div id="speedtestModal" class="modal-overlay modal-xl">
    <div class="modal-content bg-[#0b0f0e]/95 border border-primary/10 rounded-[1.4rem] shadow-2xl shadow-black/40 backdrop-blur-2xl overflow-hidden">
        <div class="relative overflow-hidden border-b border-white/10 bg-gradient-to-br from-primary/[0.07] via-white/[0.025] to-transparent">
            <div class="absolute -top-14 -right-10 w-32 h-32 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="relative z-10 px-5 py-3.5 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-primary/10 border border-primary/15 flex items-center justify-center text-primary shadow-lg shadow-primary/5 shrink-0">
                        <span class="material-symbols-outlined text-lg">speed</span>
                    </div>
                    <div>
                        <h5 class="text-sm font-black text-white tracking-tight leading-tight">Скорость — <span id="st-modal-host"></span></h5>
                        <p class="text-[9px] font-bold text-white/30 uppercase tracking-[0.18em] mt-0.5">Детальный график</p>
                    </div>
                </div>
                <button onclick="closeModal('speedtestModal')" class="w-8 h-8 rounded-lg bg-white/5 hover:bg-red-500/10 text-white/35 hover:text-red-300 border border-white/10 hover:border-red-500/20 flex items-center justify-center transition-all">
                    <span class="material-symbols-outlined text-[18px]">close</span>
                </button>
            </div>
        </div>
        <div class="p-5">
            <div class="flex flex-wrap items-center gap-3 mb-5">
                <div class="flex items-center gap-2">
                    <label class="text-[9px] font-black text-white/30 uppercase tracking-[0.18em]">Метрика:</label>
                    <select id="st-metric" class="bg-black/30 border border-white/[0.08] rounded-lg px-2.5 py-1.5 text-white text-[11px] font-bold focus:ring-1 focus:ring-primary/30 transition-all">
                        <option value="download_mbps" selected>Загрузка (Mbps)</option>
                        <option value="upload_mbps">Отдача (Mbps)</option>
                        <option value="ping_ms">Пинг (ms)</option>
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <label class="text-[9px] font-black text-white/30 uppercase tracking-[0.18em]">Период:</label>
                    <select id="st-range" class="bg-black/30 border border-white/[0.08] rounded-lg px-2.5 py-1.5 text-white text-[11px] font-bold focus:ring-1 focus:ring-primary/30 transition-all">
                        <option value="24">24 точки</option>
                        <option value="60" selected>60 точек</option>
                        <option value="120">120 точек</option>
                    </select>
                </div>
                <button id="st-refresh" class="px-3 py-1.5 rounded-lg bg-primary/10 border border-primary/15 text-primary text-[9px] font-black uppercase tracking-[0.18em] hover:bg-primary/20 transition-all flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-[14px]">refresh</span>
                    Обновить
                </button>
            </div>
            <div class="h-80 bg-black/20 rounded-xl border border-white/[0.05] p-4"><canvas id="st-detail-canvas"></canvas></div>
        </div>
    </div>
</div>

<div id="userGroupModal" class="modal-overlay modal-xl">
    <div class="modal-content bg-[#0b0f0e]/95 border border-primary/10 rounded-[1.6rem] shadow-2xl shadow-black/40 backdrop-blur-2xl overflow-hidden">
        <div class="relative overflow-hidden border-b border-white/10 bg-gradient-to-br from-primary/[0.08] via-white/[0.035] to-transparent">
            <div class="absolute -top-16 -right-12 w-36 h-36 bg-primary/10 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-16 -left-14 w-36 h-36 bg-primary/5 rounded-full blur-3xl"></div>
            <div class="relative z-10 p-4 flex flex-col sm:flex-row sm:items-start justify-between gap-3">
                <div class="flex items-start gap-3 min-w-0">
                    <div id="userGroupModalIcon" class="w-10 h-10 rounded-xl bg-primary/10 border border-primary/20 text-primary flex items-center justify-center shadow-lg shadow-primary/10 shrink-0">
                        <span class="material-symbols-outlined text-xl">group</span>
                    </div>
                    <div class="min-w-0">
                        <div class="flex flex-wrap items-center gap-2 mb-1.5">
                            <span class="text-[9px] font-black uppercase tracking-[0.22em] text-white/35">Сегмент пользователей</span>
                            <span id="userGroupModalCount" class="px-2 py-0.5 rounded-md bg-primary/10 border border-primary/15 text-primary text-[9px] font-black tabular-nums">—</span>
                        </div>
                        <h5 class="text-white font-black text-lg tracking-tight leading-tight" id="userGroupModalTitle">Пользователи</h5>
                        <p id="userGroupModalDesc" class="text-white/45 text-[11px] mt-1.5 max-w-2xl leading-relaxed"></p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="loadAllUserGroup()" id="ugm-load-all-btn" class="h-8 px-2.5 rounded-lg bg-white/5 hover:bg-primary/10 text-white/45 hover:text-primary border border-white/10 hover:border-primary/20 flex items-center gap-1.5 text-[9px] font-black uppercase tracking-wider transition-all" title="Загрузить всех пользователей в список сразу">
                        <span class="material-symbols-outlined text-[15px]">download_for_offline</span>
                        <span>Все</span>
                    </button>
                    <button onclick="copyUserGroupIds()" class="w-8 h-8 rounded-lg bg-white/5 hover:bg-primary/10 text-white/45 hover:text-primary border border-white/10 hover:border-primary/20 flex items-center justify-center transition-all" title="Скопировать Telegram ID">
                        <span class="material-symbols-outlined text-[16px]">content_copy</span>
                    </button>
                    <button onclick="closeModal('userGroupModal')" class="w-8 h-8 rounded-lg bg-white/5 hover:bg-red-500/10 text-white/45 hover:text-red-300 border border-white/10 hover:border-red-500/20 flex items-center justify-center transition-all" title="Закрыть">
                        <span class="material-symbols-outlined text-[18px]">close</span>
                    </button>
                </div>
            </div>
        </div>
        <div class="p-3 sm:p-4 bg-gradient-to-b from-black/10 to-black/25">
            <div id="userGroupModalContent" class="overflow-x-auto rounded-xl border border-white/10 bg-black/25 max-h-[56vh] overflow-y-auto shadow-inner shadow-black/20">
                <table class="w-full text-left border-collapse min-w-[650px]">
                    <thead class="bg-white/[0.04] backdrop-blur-md border-b border-white/10 sticky top-0 z-10">
                        <tr>
                            <th class="px-4 py-2.5 text-[9px] font-black uppercase tracking-[0.18em] text-white/35">Пользователь</th>
                            <th class="px-4 py-2.5 text-[9px] font-black uppercase tracking-[0.18em] text-white/35">Финансы</th>
                            <th class="px-4 py-2.5 text-[9px] font-black uppercase tracking-[0.18em] text-white/35">Ключ / срок</th>
                            <th id="th_months_bought" class="px-4 py-2.5 text-[9px] font-black uppercase tracking-[0.18em] text-white/35 text-center hidden">Куплено мес.</th>
                            <th class="px-4 py-2.5 text-[9px] font-black uppercase tracking-[0.18em] text-white/35 text-center">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="userGroupModalBody" class="divide-y divide-white/[0.06]">
                        <tr><td colspan="4" class="p-8 text-center text-white/30">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
