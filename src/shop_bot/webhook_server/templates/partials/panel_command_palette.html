<div id="panel-cmdk" class="panel-cmdk hidden" role="dialog" aria-modal="true" aria-labelledby="panel-cmdk-title">
    <div class="panel-cmdk__backdrop" data-cmdk-close></div>
    <div class="panel-cmdk__panel">
        <div class="panel-cmdk__head">
            <span class="material-symbols-outlined">search</span>
            <input id="panel-cmdk-input" type="search" autocomplete="off" spellcheck="false"
                placeholder="Поиск разделов и действий…" aria-label="Поиск" />
            <kbd class="panel-cmdk__esc">Esc</kbd>
        </div>
        <ul id="panel-cmdk-list" class="panel-cmdk__list" role="listbox"></ul>
        <div class="panel-cmdk__foot">
            <span><kbd>↑</kbd><kbd>↓</kbd> навигация</span>
            <span><kbd>Enter</kbd> открыть</span>
        </div>
    </div>
</div>
